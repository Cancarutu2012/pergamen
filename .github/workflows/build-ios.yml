name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd folio
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Build iOS Application (Unsigned Release)
        run: |
          cd folio
          mkdir -p build/ios/SourcePackages
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloading
        run: |
          mkdir -p build-ipa/Payload
          cp -R folio/build/ios/iphoneos/Runner.app build-ipa/Payload/
          cd build-ipa
          zip -r -9 Pergamen-1.2.12-BETA.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pergamen-1.2.12-BETA-iOS
          path: build-ipa/Pergamen-1.2.12-BETA.ipa
          retention-days: 14
