name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter (Disable Swift Package Manager)
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: |
          cd folio
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Build iOS Application (Unsigned Release via CocoaPods)
        run: |
          cd folio
          mkdir -p build/ios/SourcePackages
          flutter build ios --release --no-codesign

      - name: Package IPAs for Sideloading
        run: |
          mkdir -p output

          # -------------------------------------------------------------
          # 1. Standard Sideload IPA (Clean, No Extensions)
          # Recommended for Sideloadly, AltStore, SideStore, and TrollStore
          # Free Apple IDs cannot sign Live Activity extensions without crashing.
          # -------------------------------------------------------------
          mkdir -p build-ipa-standard/Payload
          cp -a folio/build/ios/iphoneos/Runner.app build-ipa-standard/Payload/
          rm -rf build-ipa-standard/Payload/Runner.app/PlugIns

          # Ensure execute permissions on binary and frameworks
          chmod -R a+rX build-ipa-standard/Payload/Runner.app
          chmod +x build-ipa-standard/Payload/Runner.app/Runner

          # Re-sign embedded frameworks and app ad-hoc
          if [ -d "build-ipa-standard/Payload/Runner.app/Frameworks" ]; then
            find build-ipa-standard/Payload/Runner.app/Frameworks -mindepth 1 -maxdepth 1 -name "*.framework" -exec codesign --force --verify --verbose --sign - {} \;
          fi
          codesign --force --verify --verbose --sign - build-ipa-standard/Payload/Runner.app

          cd build-ipa-standard
          zip -qry -9 ../output/Pergamen-1.2.12-BETA.ipa Payload
          cd ..

          # -------------------------------------------------------------
          # 2. TrollStore IPA (Includes livecard.appex extension)
          # For TrollStore users or paid developer certificates
          # -------------------------------------------------------------
          mkdir -p build-ipa-full/Payload
          cp -a folio/build/ios/iphoneos/Runner.app build-ipa-full/Payload/

          chmod -R a+rX build-ipa-full/Payload/Runner.app
          chmod +x build-ipa-full/Payload/Runner.app/Runner

          if [ -d "build-ipa-full/Payload/Runner.app/Frameworks" ]; then
            find build-ipa-full/Payload/Runner.app/Frameworks -mindepth 1 -maxdepth 1 -name "*.framework" -exec codesign --force --verify --verbose --sign - {} \;
          fi
          if [ -d "build-ipa-full/Payload/Runner.app/PlugIns" ]; then
            find build-ipa-full/Payload/Runner.app/PlugIns -mindepth 1 -maxdepth 1 -name "*.appex" -exec codesign --force --verify --verbose --sign - {} \;
          fi
          codesign --force --verify --verbose --sign - build-ipa-full/Payload/Runner.app

          cd build-ipa-full
          zip -qry -9 ../output/Pergamen-1.2.12-BETA-TrollStore.ipa Payload
          cd ..

          ls -lh output/

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pergamen-1.2.12-BETA-iOS
          path: output/*.ipa
          retention-days: 14
