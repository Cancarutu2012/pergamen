name: Build Pergamen (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'pergamen_web/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter (Disable Swift Package Manager)
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: |
          cd folio
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Build iOS Application (Unsigned Release via CocoaPods)
        run: |
          cd folio
          mkdir -p build/ios/SourcePackages
          flutter build ios --release --no-codesign

      - name: Package IPAs for Sideloading
        run: |
          mkdir -p output

          # -------------------------------------------------------------
          # 1. Standard Sideload IPA (Clean, No Extensions)
          # Recommended for Sideloadly, AltStore, SideStore, and TrollStore
          # Free Apple IDs cannot sign Live Activity extensions without crashing.
          # -------------------------------------------------------------
          mkdir -p build-ipa-standard/Payload
          cp -a folio/build/ios/iphoneos/Runner.app build-ipa-standard/Payload/
          cp folio/ios/Runner/*.png build-ipa-standard/Payload/Runner.app/ 2>/dev/null || true
          rm -rf build-ipa-standard/Payload/Runner.app/PlugIns

          # Ensure execute permissions on binary and frameworks
          chmod -R a+rX build-ipa-standard/Payload/Runner.app
          chmod +x build-ipa-standard/Payload/Runner.app/Runner

          # Re-sign embedded frameworks and app ad-hoc
          if [ -d "build-ipa-standard/Payload/Runner.app/Frameworks" ]; then
            find build-ipa-standard/Payload/Runner.app/Frameworks -mindepth 1 -maxdepth 1 -name "*.framework" -exec codesign --force --verify --verbose --sign - {} \;
          fi
          codesign --force --verify --verbose --sign - build-ipa-standard/Payload/Runner.app

          cd build-ipa-standard
          zip -qry -9 ../output/Pergamen-1.2.15-BETA.ipa Payload
          cd ..

          # -------------------------------------------------------------
          # 2. TrollStore IPA (Includes livecard.appex extension)
          # For TrollStore users or paid developer certificates
          # -------------------------------------------------------------
          mkdir -p build-ipa-full/Payload
          cp -a folio/build/ios/iphoneos/Runner.app build-ipa-full/Payload/
          cp folio/ios/Runner/*.png build-ipa-full/Payload/Runner.app/ 2>/dev/null || true

          chmod -R a+rX build-ipa-full/Payload/Runner.app
          chmod +x build-ipa-full/Payload/Runner.app/Runner

          if [ -d "build-ipa-full/Payload/Runner.app/Frameworks" ]; then
            find build-ipa-full/Payload/Runner.app/Frameworks -mindepth 1 -maxdepth 1 -name "*.framework" -exec codesign --force --verify --verbose --sign - {} \;
          fi
          if [ -d "build-ipa-full/Payload/Runner.app/PlugIns" ]; then
            find build-ipa-full/Payload/Runner.app/PlugIns -mindepth 1 -maxdepth 1 -name "*.appex" -exec codesign --force --verify --verbose --sign - {} \;
          fi
          codesign --force --verify --verbose --sign - build-ipa-full/Payload/Runner.app

          cd build-ipa-full
          zip -qry -9 ../output/Pergamen-1.2.15-BETA-TrollStore.ipa Payload
          cd ..

          ls -lh output/

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pergamen-1.2.15-BETA-iOS
          path: output/*.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

          # Ensure persistent Pergamen release keystore is present for consistent signatures across all CI builds
          mkdir -p folio/android
          if [ ! -f folio/android/key.jks ]; then
            cat << 'EOF' | base64 -d > folio/android/key.jks
          
          EOF
          fi
          if [ ! -f folio/android/key.properties ]; then
            cat << 'EOF' > folio/android/key.properties
          storePassword=pergamen
          keyPassword=pergamen
          keyAlias=key
          storeFile=key.jks
          EOF
          fi

      - name: Install dependencies
        run: |
          cd folio
          flutter pub get

      - name: Patch legacy v1 embedding in image_crop_plus
        run: |
          python3 -c "
          import glob, re, os
          for f in glob.glob(os.path.expanduser('~/.pub-cache/**/ImageCropPlugin.java'), recursive=True):
              with open(f, 'r') as fp:
                  c = fp.read()
              c = c.replace('import io.flutter.plugin.common.PluginRegistry.Registrar;', '// import io.flutter.plugin.common.PluginRegistry.Registrar;')
              c = re.sub(r'public static void registerWith\(Registrar registrar\)[\s\S]*?^\s*\}', '/* legacy registerWith removed */', c, flags=re.MULTILINE)
              with open(f, 'w') as fp:
                  fp.write(c)
              print('Successfully patched', f)
          "

      - name: Build Android APK
        run: |
          cd folio
          flutter build apk --release --flavor github
          mkdir -p ../output-apk
          cp build/app/outputs/flutter-apk/app-github-release.apk ../output-apk/Pergamen-1.2.15-BETA.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pergamen-1.2.15-BETA-Android
          path: output-apk/Pergamen-1.2.15-BETA.apk
          retention-days: 14
